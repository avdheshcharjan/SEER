[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@gnosis/conditional-tokens-contracts/=lib/conditional-tokens-contracts/contracts/",
    "@gnosis/conditional-tokens-market-makers/=lib/conditional-tokens-market-makers/contracts/",
    "@gnosis/util-contracts/=lib/util-contracts/contracts/"
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base_mainnet = "https://mainnet.base.org"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
base_mainnet = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
